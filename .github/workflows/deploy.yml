name: Publicar admisión en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Verificar dirección pública de API
        env:
          ADMISSION_API_URL: ${{ vars.ADMISSION_API_URL || 'https://jeisglrbvenpqrofhnny.supabase.co/functions/v1/admission' }}
        run: test -n "$ADMISSION_API_URL"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          ADMISSION_API_URL: ${{ vars.ADMISSION_API_URL || 'https://jeisglrbvenpqrofhnny.supabase.co/functions/v1/admission' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
