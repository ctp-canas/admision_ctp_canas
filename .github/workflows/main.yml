name: Publicar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar archivos públicos
        run: |
          mkdir -p _site
          cp index.html admin.html app.js style.css config.js plantilla_importacion.csv _site/
          cp -R admin assets _site/
          touch _site/.nojekyll
          node scripts/inject-config.mjs _site/config.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v4
